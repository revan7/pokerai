[package]
name = "solver-worker"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0"
build = "build.rs"

[[bin]]
name = "solver-worker"
path = "src/main.rs"

[features]
# Long-running suites outside the default gate (CLAUDE.md section 5): `cargo test -p solver-worker --features exhaustive`.
exhaustive = []

[dependencies]
proto = { path = "../crates/proto" }
postflop-solver = { path = "../third_party/postflop-solver", features = ["zstd"] }
serde.workspace = true
serde_json.workspace = true
rayon = "1"
