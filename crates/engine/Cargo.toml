[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coverage classifier, tree builder, worker client and result assembly (spec sections 4.4, 5, 10.1)"

[dependencies]
proto = { path = "../proto" }
core-model = { path = "../core-model" }
core-ranges = { path = "../core-ranges" }
core-iso = { path = "../core-iso" }
core-eval = { path = "../core-eval" }
core-preflop = { path = "../core-preflop" }
core-replay = { path = "../core-replay" }
cache = { path = "../cache" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Enables `testing` (fake clock, fake worker, recording sink: Task 19) for this crate's own test and example builds.
# Cargo unifies features within one build, so in a workspace test run (`cargo test --workspace`, debug or release) the
# other members' test binaries link this same `testing`-enabled engine; ordinary non-test builds (`cargo build`, with
# or without `--release`) never enable `testing` through this edge. `test-templates` (plan 4 Task 8: the three spec
# 13.1 T4 cache test templates behind `install_cache_test_templates`) rides the same edge under the same rule.
engine = { path = ".", features = ["testing", "test-templates"] }

[features]
# Fake clock, fake worker and recording sink (Task 19). Never enabled by a release consumer. It forwards the cache's own
# `testing` seam (plan 4 Task 10 fix round 1, P4T10-I5: a lookup deadline on the fake clock, `Cache::with_logical_clock`).
testing = ["cache/testing"]
# Extra tree templates registered by a downstream test harness (plan 4 Task 8).
test-templates = []
